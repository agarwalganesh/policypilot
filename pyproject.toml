[project]
name = "policypilot"
version = "0.1.0"
description = "PolicyPilot - Enterprise AI Policy Intelligence Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.3",
    "Flask-CORS>=4.0.1",
    "Werkzeug>=3.0.3",
    "SQLAlchemy>=2.0.36",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-google-genai>=2.0.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.38",
    "langsmith>=0.1.140",
    "chromadb>=0.5.18",
    "PyMuPDF>=1.24.12",
    "python-docx>=1.1.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dateutil>=2.9.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
