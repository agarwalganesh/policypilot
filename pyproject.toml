[project]
name = "policypilot"
version = "0.1.0"
description = "PolicyPilot - Enterprise AI Policy Intelligence Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.3",
    "Flask-CORS>=4.0.1",
    "Werkzeug>=3.0.3",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.13.3",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.38",
    "langsmith>=0.1.140",
    "chromadb>=0.5.18",
    "PyMuPDF>=1.24.12",
    "python-docx>=1.1.2",
    "unstructured>=0.16.7",
    "tiktoken>=0.8.0",
    "nltk>=3.9.1",
    "deepeval>=1.5.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.18",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dateutil>=2.9.0",
    "bleach>=6.1.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
